<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS | Google Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background-color: #ffffff; color: #202124; }
        .play-button { background-color: #01875f; transition: background-color 0.2s; cursor: pointer; }
        .play-button:hover { background-color: #006b4c; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .app-shadow { box-shadow: 0 1px 2px 0 rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15); }
    </style>
</head>
<body class="bg-gray-50">

    <header class="bg-white border-b sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <svg viewBox="0 0 24 24" class="w-8 h-8" fill="none"><path d="M3.529 1.41a2.126 2.126 0 0 0-.472 1.48v18.22c0 .584.19 1.127.472 1.48l10.393-10.42L3.529 1.41z" fill="#EA4335"/><path d="M17.433 15.367l-3.511-3.511L3.529 22.27c.348.31.81.5 1.32.5.405 0 .783-.114 1.109-.311l11.475-7.092z" fill="#FBBC04"/><path d="M3.529 1.731c-.347.309-.508.73-.508 1.16v18.22c0 .43.161.851.508 1.16L13.922 11.85 3.529 1.731z" fill="#4285F4"/><path d="M17.433 8.333l-11.475-7.09A2.115 2.115 0 0 0 4.849 1c-.51 0-.972.19-1.32.5l10.393 10.358 3.511-3.525z" fill="#34A853"/></svg>
            <span class="text-xl text-gray-600 font-medium">Google Play</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto bg-white min-h-screen sm:mt-4 sm:rounded-xl overflow-hidden shadow-sm">
        <section class="p-6 md:p-10 flex flex-col md:flex-row gap-8 items-start">
            <div class="w-24 h-24 md:w-48 md:h-48 rounded-2xl overflow-hidden app-shadow border border-gray-100 flex-shrink-0">
                <img src="https://img.freepik.com/free-vector/modern-os-logo-concept_23-2147915594.jpg" alt="LifeOS Icon" class="w-full h-full object-cover">
            </div>
            <div class="flex-grow">
                <h1 class="text-3xl md:text-5xl font-bold text-gray-900 mb-2">LifeOS</h1>
                <p class="text-green-700 font-medium text-lg mb-4">Mahmoud Ahmed • مبرمج تطبيقات</p>
                <div class="flex flex-wrap gap-3">
                    <button id="downloadBtn" class="play-button text-white px-10 py-2.5 rounded-lg font-medium text-sm md:text-base shadow-sm">
                        تثبيت
                    </button>
                </div>
            </div>
        </section>

        <!-- Stats Bar -->
        <section class="px-6 md:px-10 py-4 flex justify-between border-b overflow-x-auto hide-scrollbar text-center">
            <div class="px-4 border-l last:border-l-0 flex-shrink-0">
                <p class="text-gray-900 font-bold flex items-center justify-center gap-1">5.0 <span class="text-[10px]">★</span></p>
                <p class="text-xs text-gray-500">مراجعات حقيقية</p>
            </div>
            <div class="px-4 border-l last:border-l-0 flex-shrink-0">
                <p id="downloadCount" class="text-gray-900 font-bold">--</p>
                <p class="text-xs text-gray-500">عمليات التنزيل</p>
            </div>
            <div class="px-4 border-l last:border-l-0 flex-shrink-0">
                <p class="text-gray-900 font-bold">90 MB</p>
                <p class="text-xs text-gray-500">الحجم</p>
            </div>
        </section>

        <!-- Gallery -->
        <section class="py-8">
            <div class="flex gap-4 overflow-x-auto px-6 md:px-10 pb-4 hide-scrollbar">
                <img src="https://via.placeholder.com/240x480/f3f4f6/999?text=LifeOS+1" class="h-64 md:h-96 rounded-xl border">
                <img src="https://via.placeholder.com/240x480/f3f4f6/999?text=LifeOS+2" class="h-64 md:h-96 rounded-xl border">
            </div>
        </section>
    </main>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'life-os-tracking';

        const downloadLink = "https://www.mediafire.com/file/dktu494de5txn2r/life_os.apk/file";
        const statsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats');

        // 1. Auth First
        async function init() {
            try {
                await signInAnonymously(auth);
            } catch (err) { console.error("Auth failed", err); }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 2. Track & Display Count
                onSnapshot(statsDocRef, (snap) => {
                    if (snap.exists()) {
                        document.getElementById('downloadCount').innerText = snap.data().count || 90;
                    } else {
                        // Initialize if doesn't exist
                        setDoc(statsDocRef, { count: 90 });
                        document.getElementById('downloadCount').innerText = 90;
                    }
                }, (err) => console.error("Snapshot error", err));
            }
        });

        // 3. Increment on Click
        document.getElementById('downloadBtn').onclick = async () => {
            if (auth.currentUser) {
                await updateDoc(statsDocRef, {
                    count: increment(1)
                });
            }
            window.open(downloadLink, '_blank');
        };

        init();
    </script>
</body>
</html>
